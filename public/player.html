<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pause Miweb - Rejoindre</title>
    <link rel="stylesheet" href="css/multiplayer.css">
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%23a29bfe' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M14 6c-2.2 0-4 1.8-4 4 0 .5.1 1 .3 1.5C8.9 12.2 8 13.5 8 15s.9 2.8 2.3 3.5c-.2.5-.3 1-.3 1.5 0 2.2 1.8 4 4 4 .7 0 1.4-.2 2-.6V6.6c-.6-.4-1.3-.6-2-.6Z'/><path d='M18 6c2.2 0 4 1.8 4 4 0 .5-.1 1-.3 1.5 1.4.7 2.3 2 2.3 3.5s-.9 2.8-2.3 3.5c.2.5.3 1 .3 1.5 0 2.2-1.8 4-4 4-.7 0-1.4-.2-2-.6V6.6c.6-.4 1.3-.6 2-.6Z'/></svg>">
</head>
<body class="player-view">
    <!-- Écran de connexion -->
    <div id="screen-join" class="screen active">
        <div class="container">
            <div class="logo">
                <h1>Pause<span>Miweb</span></h1>
            </div>

            <div class="join-form">
                <input type="text" id="input-name" placeholder="Ton prénom" maxlength="20" autocomplete="off" autofocus>
                <input type="text" id="input-room" placeholder="Code de la room" maxlength="4" autocomplete="off" style="text-transform: uppercase">
                <button id="btn-join" class="btn btn-primary btn-large">Rejoindre</button>
                <div id="join-error" class="error-msg hidden"></div>
            </div>
        </div>
    </div>

    <!-- Écran d'attente -->
    <div id="screen-waiting" class="screen">
        <div class="container center-content">
            <div class="waiting-icon">✓</div>
            <h2>Connecté !</h2>
            <p class="waiting-text">En attente du lancement par l'hôte...</p>
            <p class="player-name-display" id="my-name"></p>
        </div>
    </div>

    <!-- Écran de question -->
    <div id="screen-question" class="screen">
        <div class="container">
            <div class="player-game-header">
                <span id="p-round">Question 1/20</span>
                <span id="p-timer" class="timer">20</span>
            </div>

            <div class="player-question">
                <div class="category-badge" id="p-category"></div>
                <div class="question-text" id="p-question-text"></div>
            </div>

            <!-- MCQ -->
            <div id="p-mcq" class="player-mcq hidden"></div>

            <!-- Yes/No -->
            <div id="p-yesno" class="player-yesno hidden">
                <button class="btn btn-answer btn-vrai" data-answer="oui">👍 Vrai</button>
                <button class="btn btn-answer btn-faux" data-answer="non">👎 Faux</button>
            </div>

            <!-- Free text -->
            <div id="p-free" class="player-free hidden">
                <input type="text" id="p-free-input" placeholder="Ta réponse..." autocomplete="off">
                <button id="p-free-submit" class="btn btn-primary">Valider</button>
            </div>
        </div>
    </div>

    <!-- Écran réponse envoyée -->
    <div id="screen-answered" class="screen">
        <div class="container center-content">
            <div class="answered-icon">⏳</div>
            <p>Réponse envoyée !</p>
            <p class="sub-text">En attente des autres joueurs...</p>
        </div>
    </div>

    <!-- Écran résultat -->
    <div id="screen-result" class="screen">
        <div class="container center-content">
            <div id="p-result-icon" class="result-icon"></div>
            <div id="p-result-text" class="result-text"></div>
            <div id="p-correct-answer" class="correct-answer-player"></div>
            <div id="p-score" class="player-score"></div>
        </div>
    </div>

    <!-- Écran final -->
    <div id="screen-player-final" class="screen">
        <div class="container center-content">
            <h1>🏆 Fin de la partie !</h1>
            <div id="p-final-rank" class="final-rank"></div>
            <div id="p-final-score" class="final-score-display"></div>
            <button id="btn-play-again" class="btn btn-primary btn-large">Rejouer</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
