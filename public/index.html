<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pause Miweb - Le quizz entre collègues</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%23a29bfe' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M14 6c-2.2 0-4 1.8-4 4 0 .5.1 1 .3 1.5C8.9 12.2 8 13.5 8 15s.9 2.8 2.3 3.5c-.2.5-.3 1-.3 1.5 0 2.2 1.8 4 4 4 .7 0 1.4-.2 2-.6V6.6c-.6-.4-1.3-.6-2-.6Z'/><path d='M18 6c2.2 0 4 1.8 4 4 0 .5-.1 1-.3 1.5 1.4.7 2.3 2 2.3 3.5s-.9 2.8-2.3 3.5c.2.5.3 1 .3 1.5 0 2.2-1.8 4-4 4-.7 0-1.4-.2-2-.6V6.6c.6-.4 1.3-.6 2-.6Z'/></svg>">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #07061a;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Radial gradient glows */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 600px 500px at 20% 10%, rgba(139, 92, 246, 0.18) 0%, transparent 70%),
                radial-gradient(ellipse 500px 400px at 85% 90%, rgba(34, 211, 238, 0.12) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Ambient floating dots */
        .ambient-dots {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-dot {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #8b5cf6;
            opacity: 0;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 0.25;
            }
            90% {
                opacity: 0.25;
            }
            100% {
                transform: translateY(-100vh) translateX(20px);
                opacity: 0;
            }
        }

        /* Background SVG icons */
        .bg-decoration {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-decoration svg {
            position: absolute;
            opacity: 0.07;
        }

        .bg-deco-1 { top: 5%; left: -2%; width: 260px; transform: rotate(-15deg); }
        .bg-deco-2 { top: 12%; right: -4%; width: 200px; transform: rotate(20deg); }
        .bg-deco-3 { bottom: 18%; left: 4%; width: 180px; transform: rotate(-25deg); }
        .bg-deco-4 { bottom: 4%; right: 2%; width: 230px; transform: rotate(10deg); }

        /* Main content */
        .screen {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 3rem 1.5rem;
        }

        .container {
            text-align: center;
            max-width: 640px;
            width: 100%;
        }

        /* Logo */
        .logo {
            position: relative;
            margin-bottom: 0.5rem;
        }

        .logo::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 120px;
            background: radial-gradient(ellipse, rgba(139, 92, 246, 0.2) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
        }

        .logo h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(3.5rem, 8vw, 5.25rem);
            line-height: 1.1;
            color: #fff;
            animation: breathe 4s ease-in-out infinite;
        }

        .logo h1 span {
            background: linear-gradient(135deg, #8b5cf6, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .tagline {
            font-size: 14px;
            color: #a78bfa;
            margin-top: 0.4rem;
            letter-spacing: 0.02em;
        }

        /* Quote block */
        .landing-quote {
            margin: 2rem auto 0;
            max-width: 460px;
            position: relative;
            padding: 0 1.5rem;
            min-height: 5.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .landing-quote::before {
            content: "\201C";
            position: absolute;
            top: -0.6rem;
            left: 0;
            font-size: 3rem;
            color: #8b5cf6;
            opacity: 0.3;
            font-family: Georgia, serif;
            line-height: 1;
        }

        .landing-quote p {
            font-size: 1rem;
            font-style: italic;
            color: #8f86c2;
            line-height: 1.55;
        }

        .landing-quote cite {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.875rem;
            color: #a78bfa;
            font-style: normal;
            font-weight: 700;
        }

        .landing-quote p,
        .landing-quote cite {
            transition: opacity 0.4s ease;
        }

        .landing-quote.fade p,
        .landing-quote.fade cite {
            opacity: 0;
        }

        /* Mode cards grid */
        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
            max-width: 540px;
            margin: 2.5rem auto 0;
        }

        .mode-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(30, 22, 70, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(140, 120, 240, 0.18);
            border-radius: 20px;
            padding: 2rem 1.25rem 1.75rem;
            text-decoration: none;
            color: #fff;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            overflow: hidden;
        }

        /* Shine overlay */
        .mode-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 20px;
            opacity: 0;
            background: radial-gradient(circle 120px at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(139, 92, 246, 0.15), transparent 70%);
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .mode-card:hover {
            transform: translateY(-6px) rotate(0.5deg);
            box-shadow: 0 16px 40px rgba(139, 92, 246, 0.2);
        }

        .mode-card:hover::after {
            opacity: 1;
        }

        .mode-icon-wrap {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, #7c3aed, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            flex-shrink: 0;
        }

        .mode-icon-wrap svg {
            width: 28px;
            height: 28px;
            color: #fff;
        }

        .mode-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }

        .mode-desc {
            color: #8f86c2;
            font-size: 14px;
            line-height: 1.45;
        }

        /* Responsive: stack cards on small screens */
        @media (max-width: 520px) {
            .mode-selector {
                grid-template-columns: 1fr;
                max-width: 340px;
            }
        }
    </style>
</head>
<body>
    <!-- Ambient floating dots -->
    <div class="ambient-dots" aria-hidden="true">
        <div class="ambient-dot" style="left:8%;bottom:-10px;animation-duration:12s;animation-delay:0s"></div>
        <div class="ambient-dot" style="left:18%;bottom:-10px;animation-duration:15s;animation-delay:2s"></div>
        <div class="ambient-dot" style="left:30%;bottom:-10px;animation-duration:11s;animation-delay:4s"></div>
        <div class="ambient-dot" style="left:45%;bottom:-10px;animation-duration:14s;animation-delay:1s"></div>
        <div class="ambient-dot" style="left:55%;bottom:-10px;animation-duration:13s;animation-delay:3s"></div>
        <div class="ambient-dot" style="left:68%;bottom:-10px;animation-duration:16s;animation-delay:5s"></div>
        <div class="ambient-dot" style="left:78%;bottom:-10px;animation-duration:12s;animation-delay:7s"></div>
        <div class="ambient-dot" style="left:90%;bottom:-10px;animation-duration:14s;animation-delay:2.5s"></div>
    </div>

    <!-- Decorative background icons -->
    <div class="bg-decoration" aria-hidden="true">
        <!-- Question mark -->
        <svg class="bg-deco-1" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" color="#a78bfa">
            <path d="M35 35c0-12 10-20 22-20s22 8 22 20c0 10-8 15-14 18-4 2-6 5-6 9v3"/>
            <circle cx="57" cy="75" r="2.5" fill="currentColor"/>
        </svg>
        <!-- Lightning bolt -->
        <svg class="bg-deco-2" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" color="#22d3ee">
            <polygon points="55,10 25,55 45,55 40,90 75,42 52,42"/>
        </svg>
        <!-- Trophy -->
        <svg class="bg-deco-3" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" color="#a78bfa">
            <path d="M30 20h40v25c0 14-9 25-20 25s-20-11-20-25z"/>
            <path d="M30 30h-8c-4 0-7 3-7 7s3 8 7 10h8"/>
            <path d="M70 30h8c4 0 7 3 7 7s-3 8-7 10h-8"/>
            <line x1="50" y1="70" x2="50" y2="82"/>
            <path d="M35 82h30c0 0 0 5-15 5s-15-5-15-5z"/>
        </svg>
        <!-- Star -->
        <svg class="bg-deco-4" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" color="#22d3ee">
            <polygon points="50,10 61,38 92,38 67,56 76,85 50,67 24,85 33,56 8,38 39,38"/>
        </svg>
    </div>

    <div class="screen">
        <div class="container">
            <div class="logo">
                <h1>Pause<span>Miweb</span></h1>
                <p class="tagline">Le quizz entre collègues</p>
            </div>

            <div class="landing-quote">
                <p>La culture, c'est comme la confiture : moins on en a, plus on l'étale.</p>
                <cite>Fran&ccedil;oise Sagan</cite>
            </div>

            <div class="mode-selector">
                <a href="solo.html" class="mode-card">
                    <div class="mode-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="8" width="20" height="10" rx="4"/><line x1="7" y1="13" x2="10" y2="13"/><line x1="8.5" y1="11.5" x2="8.5" y2="14.5"/><circle cx="15.5" cy="12" r="1.1" fill="currentColor"/><circle cx="17.5" cy="14" r="1.1" fill="currentColor"/></svg>
                    </div>
                    <div class="mode-title">Mode Solo</div>
                    <div class="mode-desc">A tour de rôle sur le même écran</div>
                </a>
                <a href="host.html" class="mode-card">
                    <div class="mode-icon-wrap">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 20v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </div>
                    <div class="mode-title">Multijoueur</div>
                    <div class="mode-desc">Chacun sur son téléphone, style Kahoot</div>
                </a>
            </div>
        </div>
    </div>

    <!-- Rotating quotes + shine effect -->
    <script>
    (function() {
        var quotes = [
            { text: "Le savoir est la seule matière qui s'accroît quand on la partage.", author: "Socrate" },
            { text: "Je vais vous éclater votre race !", author: "Un(e) anonyme de l'équipe" },
            { text: "Je ne perds jamais. Soit je gagne, soit j'apprends.", author: "Nelson Mandela" },
            { text: "C'est pas parce que je t'aime bien que je vais te laisser gagner.", author: "Tout le monde ici" },
            { text: "La culture, c'est comme la confiture : moins on en a, plus on l'étale.", author: "Françoise Sagan" },
            { text: "Vous allez voir ce que vous allez voir.", author: "La personne qui va finir dernière" },
        ];
        var el = document.querySelector('.landing-quote');
        var pEl = el.querySelector('p');
        var citeEl = el.querySelector('cite');
        var i = Math.floor(Math.random() * quotes.length);

        function show(index) {
            pEl.textContent = quotes[index].text;
            citeEl.textContent = quotes[index].author;
        }

        // Measure all quotes to lock the max height (prevents layout shift)
        var maxH = 0;
        quotes.forEach(function(q, j) {
            show(j);
            maxH = Math.max(maxH, el.offsetHeight);
        });
        el.style.minHeight = maxH + 'px';

        show(i);

        setInterval(function() {
            el.classList.add('fade');
            setTimeout(function() {
                i = (i + 1) % quotes.length;
                show(i);
                el.classList.remove('fade');
            }, 400);
        }, 5000);

        // Shine effect on mode cards (mouse-following radial gradient)
        document.querySelectorAll('.mode-card').forEach(function(card) {
            card.addEventListener('mousemove', function(e) {
                var rect = card.getBoundingClientRect();
                var x = ((e.clientX - rect.left) / rect.width * 100).toFixed(1) + '%';
                var y = ((e.clientY - rect.top) / rect.height * 100).toFixed(1) + '%';
                card.style.setProperty('--mouse-x', x);
                card.style.setProperty('--mouse-y', y);
            });
        });
    })();
    </script>
</body>
</html>
