<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pause Miweb - Le quizz entre collègues</title>
    <link rel="stylesheet" href="css/multiplayer.css">
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none' stroke='%23a29bfe' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M14 6c-2.2 0-4 1.8-4 4 0 .5.1 1 .3 1.5C8.9 12.2 8 13.5 8 15s.9 2.8 2.3 3.5c-.2.5-.3 1-.3 1.5 0 2.2 1.8 4 4 4 .7 0 1.4-.2 2-.6V6.6c-.6-.4-1.3-.6-2-.6Z'/><path d='M18 6c2.2 0 4 1.8 4 4 0 .5-.1 1-.3 1.5 1.4.7 2.3 2 2.3 3.5s-.9 2.8-2.3 3.5c.2.5.3 1 .3 1.5 0 2.2-1.8 4-4 4-.7 0-1.4-.2-2-.6V6.6c.6-.4 1.3-.6 2-.6Z'/></svg>">
    <style>
        /* Background decorative SVGs */
        body.landing {
            position: relative;
            overflow: hidden;
        }
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .bg-decoration svg {
            position: absolute;
            opacity: 0.04;
        }
        .bg-deco-1 { top: 5%; left: -3%; width: 280px; transform: rotate(-15deg); }
        .bg-deco-2 { top: 15%; right: -5%; width: 220px; transform: rotate(20deg); }
        .bg-deco-3 { bottom: 20%; left: 5%; width: 180px; transform: rotate(-25deg); }
        .bg-deco-4 { bottom: 5%; right: 2%; width: 250px; transform: rotate(10deg); }
        .bg-deco-5 { top: 45%; left: 50%; width: 300px; transform: translateX(-50%) rotate(5deg); }

        .screen { position: relative; z-index: 1; }

        .mode-selector {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 400px;
            margin: 2.5rem auto 0;
        }
        .mode-card {
            display: block;
            background: var(--bg-card);
            border: 2px solid var(--bg-card-light);
            border-radius: var(--radius);
            padding: 2rem;
            text-align: center;
            text-decoration: none;
            color: var(--white);
            transition: all 0.25s ease;
        }
        .mode-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(108, 92, 231, 0.25);
        }
        .mode-icon {
            display: block;
            width: 3rem;
            height: 3rem;
            margin: 0 auto 0.8rem;
            color: var(--primary-light);
        }
        .mode-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
        }
        .mode-desc {
            color: var(--gray);
            font-size: 0.95rem;
        }

        /* Quote styling */
        .landing-quote {
            margin: 1.8rem auto 0;
            max-width: 460px;
            position: relative;
            padding: 0 1.5rem;
        }
        .landing-quote p {
            font-size: 1.05rem;
            font-style: italic;
            color: rgba(223, 230, 233, 0.7);
            line-height: 1.5;
        }
        .landing-quote cite {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: var(--primary-light);
            font-style: normal;
            font-weight: 500;
        }
        .landing-quote::before {
            content: "\201C";
            position: absolute;
            top: -0.6rem;
            left: 0;
            font-size: 3rem;
            color: var(--primary);
            opacity: 0.3;
            font-family: Georgia, serif;
            line-height: 1;
        }
        .landing-quote p,
        .landing-quote cite {
            transition: opacity 0.4s ease;
        }
        .landing-quote.fade p,
        .landing-quote.fade cite {
            opacity: 0;
        }
    </style>
</head>
<body class="landing">
    <!-- Decorative background shapes -->
    <div class="bg-decoration" aria-hidden="true">
        <!-- Question mark -->
        <svg class="bg-deco-1" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" color="var(--primary-light)">
            <path d="M35 35c0-12 10-20 22-20s22 8 22 20c0 10-8 15-14 18-4 2-6 5-6 9v3"/>
            <circle cx="57" cy="75" r="2.5" fill="currentColor"/>
        </svg>
        <!-- Brain -->
        <svg class="bg-deco-2" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" color="var(--success)">
            <path d="M45 20c-8 0-15 6-15 14 0 2 .4 4 1 6-5 2-9 8-9 14s4 12 9 14c-0.6 2-1 4-1 6 0 8 7 14 15 14 3 0 5-.7 7-2v-52c-2-1.3-4-2-7-2z"/>
            <path d="M55 20c8 0 15 6 15 14 0 2-.4 4-1 6 5 2 9 8 9 14s-4 12-9 14c.6 2 1 4 1 6 0 8-7 14-15 14-3 0-5-.7-7-2v-52c2-1.3 4-2 7-2z"/>
        </svg>
        <!-- Lightning bolt -->
        <svg class="bg-deco-3" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" color="var(--warning)">
            <polygon points="55,10 25,55 45,55 40,90 75,42 52,42"/>
        </svg>
        <!-- Trophy -->
        <svg class="bg-deco-4" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" color="var(--danger)">
            <path d="M30 20h40v25c0 14-9 25-20 25s-20-11-20-25z"/>
            <path d="M30 30h-8c-4 0-7 3-7 7s3 8 7 10h8"/>
            <path d="M70 30h8c4 0 7 3 7 7s-3 8-7 10h-8"/>
            <line x1="50" y1="70" x2="50" y2="82"/>
            <path d="M35 82h30c0 0 0 5-15 5s-15-5-15-5z"/>
        </svg>
        <!-- Puzzle piece -->
        <svg class="bg-deco-5" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" color="var(--primary)">
            <path d="M72 40h8a6 6 0 0 1 0 12h-8v20a4 4 0 0 1-4 4h-18v-8a6 6 0 0 0-12 0v8h-18a4 4 0 0 1-4-4v-18h8a6 6 0 0 0 0-12h-8v-18a4 4 0 0 1 4-4h18v8a6 6 0 0 0 12 0v-8h18a4 4 0 0 1 4 4z"/>
        </svg>
    </div>

    <div class="screen active">
        <div class="container" style="text-align: center;">
            <div class="logo">
                <h1>Pause<span>Miweb</span></h1>
                <p class="tagline">Le quizz entre collègues</p>
            </div>

            <div class="landing-quote">
                <p>La culture, c'est comme la confiture : moins on en a, plus on l'étale.</p>
                <cite>Fran&ccedil;oise Sagan</cite>
            </div>

            <div class="mode-selector">
                <a href="solo.html" class="mode-card">
                    <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="8" width="20" height="10" rx="4"/><line x1="7" y1="13" x2="10" y2="13"/><line x1="8.5" y1="11.5" x2="8.5" y2="14.5"/><circle cx="15.5" cy="12" r="1.1" fill="currentColor"/><circle cx="17.5" cy="14" r="1.1" fill="currentColor"/></svg>
                    <div class="mode-title">Mode Solo / Local</div>
                    <div class="mode-desc">A tour de role sur le meme ecran</div>
                </a>
                <a href="host.html" class="mode-card">
                    <svg class="mode-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 20v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    <div class="mode-title">Mode Multijoueur</div>
                    <div class="mode-desc">Chacun sur son telephone, style Kahoot</div>
                </a>
            </div>
        </div>
    </div>

    <!-- Rotating quotes -->
    <script>
    (function() {
        const quotes = [
            { text: "Le savoir est la seule matiere qui s'accroit quand on la partage.", author: "Socrate" },
            { text: "Je vais vous eclater votre race !", author: "Un(e) anonyme de l'equipe" },
            { text: "Je ne perds jamais. Soit je gagne, soit j'apprends.", author: "Nelson Mandela" },
            { text: "C'est pas parce que je t'aime bien que je vais te laisser gagner.", author: "Tout le monde ici" },
            { text: "La culture, c'est comme la confiture : moins on en a, plus on l'etale.", author: "Francoise Sagan" },
            { text: "Vous allez voir ce que vous allez voir.", author: "La personne qui va finir derniere" },
        ];
        const el = document.querySelector('.landing-quote');
        const pEl = el.querySelector('p');
        const citeEl = el.querySelector('cite');
        let i = Math.floor(Math.random() * quotes.length);

        function show(index) {
            pEl.textContent = quotes[index].text;
            citeEl.textContent = quotes[index].author;
        }
        show(i);

        setInterval(function() {
            el.classList.add('fade');
            setTimeout(function() {
                i = (i + 1) % quotes.length;
                show(i);
                el.classList.remove('fade');
            }, 400);
        }, 5000);
    })();
    </script>
</body>
</html>
