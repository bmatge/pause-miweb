services:
  quiz:
    build: .
    environment:
      - PORT=3000
      - BASE_URL=https://pause-miweb.matge.com
    restart: unless-stopped
    volumes:
      - quiz-data:/app/data
    networks:
      - ecosystem-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pause-miweb.rule=Host(`pause-miweb.matge.com`)"
      - "traefik.http.routers.pause-miweb.entrypoints=websecure"
      - "traefik.http.routers.pause-miweb.tls.certresolver=letsencrypt"
      - "traefik.http.services.pause-miweb.loadbalancer.server.port=3000"

volumes:
  quiz-data:

networks:
  ecosystem-network:
    external: true
